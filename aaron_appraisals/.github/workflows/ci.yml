name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Optimize images (no-op if not configured)
        run: npm run optimize:images || echo "imagemin step skipped"

      - name: Replace originals with optimized images
        run: |
          if [ -d "src/assets/pictures/optimized" ]; then
            echo "Copying optimized images to original locations"
            cp -a src/assets/pictures/optimized/* src/assets/pictures/ || true
          else
            echo "No optimized images found; skipping copy"
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
